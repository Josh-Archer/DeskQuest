[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/capture",
    "crates/encoder",
    "crates/transport",
    "crates/input",
    "crates/host",
    "crates/client",
    "crates/display",
    "crates/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Josh Archer"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Josh-Archer/linux-quest"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
bytes = "1.9"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
crc32fast = "1.4"
parking_lot = "0.12"
libloading = "0.8"
libc = "0.2"
# Real mDNS LAN discovery (optional in linux-quest-transport, behind its `mdns` feature).
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
# QUIC control channel (optional in linux-quest-transport, behind its `quic` feature).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
sha2 = "0.10"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
