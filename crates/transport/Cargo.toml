[package]
name = "linux-quest-transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
linux-quest-protocol = { path = "../protocol" }
bytes.workspace = true
tokio.workspace = true
thiserror.workspace = true
async-trait.workspace = true
tracing.workspace = true
serde.workspace = true
bincode.workspace = true
parking_lot.workspace = true
crc32fast.workspace = true
libc = { workspace = true }
# Real mDNS LAN discovery. Off by default so default builds and tests never touch multicast.
mdns-sd = { workspace = true, optional = true }
# QUIC control channel. Off by default so default builds do not pull in quinn/rustls/rcgen.
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = []
mdns = ["dep:mdns-sd"]
quic = ["dep:quinn", "dep:rcgen", "dep:sha2"]

[dev-dependencies]
