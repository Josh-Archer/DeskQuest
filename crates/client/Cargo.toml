[package]
name = "linux-quest-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
linux-quest-protocol = { path = "../protocol" }
linux-quest-transport = { path = "../transport" }
ash = "0.38"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
bytes.workspace = true
bincode.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
crc32fast.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
libc.workspace = true
audiopus = "0.3.0-rc.0"
audiopus_sys = { version = "0.2.2", features = ["static"] }

[features]
default = []
# Real mDNS browsing for LAN discovery. Off by default; passes through to linux-quest-transport.
mdns = ["linux-quest-transport/mdns"]

[target.'cfg(not(target_os = "android"))'.dependencies]
openxr = { version = "0.22", default-features = true }

[target.'cfg(target_os = "android")'.dependencies]
# Link the Khronos loader into liblinux_quest_client.so (built from the OpenXR-SDK source that
# openxr-sys ships, via cmake and the NDK). Horizon OS does not expose its own
# libopenxr_loader.so to apps, and nothing else puts one in the APK.
openxr = { version = "0.22", default-features = false, features = ["static"] }
ndk = { version = "0.9", features = ["audio", "media", "nativewindow", "sync", "api-level-30"] }
ndk-sys = "0.6"
ndk-context = "0.1"
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.21"

[dev-dependencies]
# Paused tokio clock for the discovery scheduler tests.
tokio = { workspace = true, features = ["test-util"] }
async-trait.workspace = true
linux-quest-capture = { path = "../capture" }
linux-quest-encoder = { path = "../encoder" }
