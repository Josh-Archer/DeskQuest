[package]
name = "linux-quest-host"
description = "Linux Quest 3 VR streaming host and virtual display daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
linux-quest-protocol = { path = "../protocol" }
linux-quest-capture = { path = "../capture" }
linux-quest-encoder = { path = "../encoder" }
linux-quest-transport = { path = "../transport" }
linux-quest-input = { path = "../input" }
linux-quest-display = { path = "../display" }
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
libc.workspace = true
tokio.workspace = true
bytes.workspace = true
bincode.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
ratatui.workspace = true
crossterm.workspace = true
parking_lot.workspace = true
# Already in the lockfile via tokio; used for TCP keepalive options tokio does not expose.
socket2 = { version = "0.6", features = ["all"] }
# StatusNotifierItem tray icon (`linux-quest-host tray`); pure Rust D-Bus (zbus).
ksni = "0.3.6"
# Splits `$TERMINAL` into program and arguments without a shell (already in Cargo.lock).
shlex = "2.0.1"

[features]
default = []
# The tray is now part of every build; kept so `--features tray` still works.
tray = []
vaapi = ["linux-quest-encoder/vaapi"]
# Real mDNS advertisement of the daemon. Off by default; passes through to linux-quest-transport.
mdns = ["linux-quest-transport/mdns"]
# Real screen capture (xdg-desktop-portal ScreenCast + PipeWire). Off by default because it
# needs libpipewire-0.3-dev and libclang at build time; without it the daemon can only use the
# synthetic test pattern. Passes through to linux-quest-capture's `pipewire` feature.
pipewire-capture = ["linux-quest-capture/pipewire"]

[dev-dependencies]
linux-quest-client = { path = "../client" }
tokio = { workspace = true, features = ["test-util"] }

# Linux packaging metadata. Run from the workspace root:
#   cargo build --release -p linux-quest-host
#   cargo deb -p linux-quest-host --no-build
#   cargo generate-rpm -p crates/host
# cargo-deb resolves asset paths relative to this crate directory ("../../" below),
# except "target/release/..." which it resolves against the workspace target directory.
# cargo-generate-rpm resolves asset paths relative to the working directory (workspace root).
[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto"
# Debian-format copyright file (installed as /usr/share/doc/linux-quest-host/copyright).
license-file = ["../../packaging/debian/copyright", "0"]
# postinst reloads udev so the uinput rule applies without a reboot (best effort).
maintainer-scripts = "../../packaging/debian/"
extended-description = """\
Linux Quest host daemon: streams a Linux desktop or virtual display to a Meta Quest 3 \
over the network or USB/ADB and injects Quest input through /dev/uinput. \
The package installs a udev rule granting the 'input' group access to /dev/uinput; \
add your user to that group and log in again. It loads the uinput module at boot and \
ships a systemd user unit: systemctl --user enable --now linux-quest-host."""
assets = [
    ["target/release/linux-quest-host", "usr/bin/", "755"],
    ["../../packaging/udev/99-uinput.rules", "usr/lib/udev/rules.d/99-uinput.rules", "644"],
    ["../../packaging/modules-load/linux-quest.conf", "usr/lib/modules-load.d/linux-quest.conf", "644"],
    ["../../packaging/systemd/linux-quest-host.service", "usr/lib/systemd/user/linux-quest-host.service", "644"],
    ["../../packaging/systemd/linux-quest-tray.service", "usr/lib/systemd/user/linux-quest-tray.service", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/linux-quest-host/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/linux-quest-host/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
license = "MIT OR Apache-2.0"
summary = "Linux Quest 3 VR streaming host and virtual display daemon"
# Reload udev so the uinput rule applies without a reboot (best effort).
post_install_script = "udevadm control --reload || true\nudevadm trigger || true"
assets = [
    { source = "target/release/linux-quest-host", dest = "/usr/bin/linux-quest-host", mode = "755" },
    { source = "packaging/udev/99-uinput.rules", dest = "/usr/lib/udev/rules.d/99-uinput.rules", mode = "644" },
    { source = "packaging/modules-load/linux-quest.conf", dest = "/usr/lib/modules-load.d/linux-quest.conf", mode = "644" },
    { source = "packaging/systemd/linux-quest-host.service", dest = "/usr/lib/systemd/user/linux-quest-host.service", mode = "644" },
    { source = "packaging/systemd/linux-quest-tray.service", dest = "/usr/lib/systemd/user/linux-quest-tray.service", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/linux-quest-host/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/linux-quest-host/LICENSE-APACHE", mode = "644" },
]
