name: Release

# Builds Linux packages (.deb, .rpm, raw tarball) and the Quest APK for a
# version tag, then attaches them to a GitHub Release.
#
# Flatpak is intentionally not built here (tracked separately, out of scope for #33).
# The AUR PKGBUILD lives in packaging/arch and is published to AUR by hand.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Resolved tag: the pushed tag, or the tag typed into workflow_dispatch.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # TODO(#33): Set to "true" once a real release keystore is configured (see the
  # android-apk job). Until then the APK is debug-signed, the asset is named
  # *-debugsigned.apk, and the GitHub Release is marked as a pre-release.
  APK_KEYSTORE_CONFIGURED: "false"

jobs:
  verify-version:
    name: Verify tag matches workspace version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time; TODO refresh when bumping)

      - name: Compare tag with workspace version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          # cargo metadata reports the resolved version of every workspace member, so the
          # check does not depend on how Cargo.toml is formatted.
          METADATA="$(cargo metadata --no-deps --format-version 1 --locked)"
          VERSIONS="$(jq -r '[.packages[].version] | unique | join(" ")' <<<"${METADATA}")"
          if [ "${VERSIONS}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match workspace version(s): ${VERSIONS}"
            exit 1
          fi
          echo "Releasing ${RELEASE_TAG} (workspace version ${VERSIONS})"

  host-packages:
    name: Host binary, .deb and .rpm
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential edid-decode

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time; TODO refresh when bumping)

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "linux-quest-release"

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build host release binary
        run: cargo build --release --locked -p linux-quest-host

      - name: Build .deb
        run: cargo deb -p linux-quest-host --no-build

      - name: Build .rpm
        run: cargo generate-rpm -p crates/host

      - name: Build raw tarball
        run: |
          set -euo pipefail
          STAGE="linux-quest-host-${RELEASE_TAG}-x86_64-linux"
          mkdir -p "dist/${STAGE}"
          cp target/release/linux-quest-host "dist/${STAGE}/"
          cp packaging/udev/99-uinput.rules "dist/${STAGE}/"
          cp LICENSE-MIT LICENSE-APACHE "dist/${STAGE}/"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Collect host artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp target/debian/*.deb release-artifacts/
          cp target/generate-rpm/*.rpm release-artifacts/
          cp "dist/linux-quest-host-${RELEASE_TAG}-x86_64-linux.tar.gz" release-artifacts/
          ls -l release-artifacts

      - name: Upload host artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-packages
          path: release-artifacts/*
          if-no-files-found: error

  android-apk:
    name: Quest APK (debug-signed)
    needs: verify-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # TODO(#33): The APK is signed with the debug keystore that build.sh generates,
    # so it is installable but not a production-signed release. Before a public
    # Play/Store-style distribution, add a release keystore from encrypted
    # secrets (base64 keystore + passwords) and teach build.sh to use it instead
    # of creating a debug keystore.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake edid-decode

      - name: Install Android SDK components (platform, build-tools, NDK)
        # ANDROID_SDK_ROOT is provided by the ubuntu-latest runner image.
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018"

      - name: Setup Java (keytool for the debug keystore)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch head at pin time; TODO refresh when bumping)
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: "linux-quest-android-release"

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk

      - name: Build and sign APK via build.sh
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/27.2.12479018"
          bash crates/client/android/build.sh --release

      - name: Rename APK for release
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp crates/client/target/android-apk/linux-quest-release.apk \
             "release-artifacts/linux-quest-${RELEASE_TAG}-debugsigned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quest-apk
          path: release-artifacts/*.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [host-packages, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Download host packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: host-packages
          path: release-artifacts

      - name: Download Quest APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quest-apk
          path: release-artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          # Until a release keystore is configured, keep releases as pre-releases.
          # Tags containing '-' (e.g. v0.2.0-rc1) are pre-releases as well.
          if [[ "${APK_KEYSTORE_CONFIGURED}" != "true" || "${RELEASE_TAG}" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES_FILE="release-notes.md"
          if [[ "${APK_KEYSTORE_CONFIGURED}" != "true" ]]; then
            cat > "${NOTES_FILE}" <<EOF
          **Quest APK is debug-signed.** linux-quest-${RELEASE_TAG}-debugsigned.apk is signed with the
          debug keystore that crates/client/android/build.sh generates. It installs by sideloading
          (scripts/install-quest.sh) but is not a production-signed release, so this release is marked
          as a pre-release until a release keystore is configured.

          EOF
          else
            : > "${NOTES_FILE}"
          fi
          # Append the same auto-generated notes that --generate-notes used to produce.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${RELEASE_TAG}" --jq '.body' >> "${NOTES_FILE}"
          if gh release view "${RELEASE_TAG}" > /dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-artifacts/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-artifacts/* \
              --title "linux-quest ${RELEASE_TAG}" \
              --notes-file "${NOTES_FILE}" \
              ${PRERELEASE_FLAG}
          fi
