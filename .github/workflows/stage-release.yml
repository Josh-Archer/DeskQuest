name: Stage draft release

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful mainline Packaging workflow run ID
        required: true
        type: string
      tag:
        description: Version tag, for example v0.1.0 (creates a draft only)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: stage-release
  cancel-in-progress: false

jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify artifact source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          python3 - <<'PY'
          import json, os, tomllib
          run = json.load(open('run.json'))
          if (run['conclusion'] != 'success' or run['head_branch'] != 'main'
              or run['head_repository']['full_name'] != os.environ['GH_REPO']
              or run['path'] != '.github/workflows/packaging.yml'):
              raise SystemExit('Choose a successful mainline Packaging run')
          version = tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the workspace package version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('sha=' + run['head_sha'], file=out)
          PY
      - name: Download verified package artifacts
        run: gh run download "$BUILD_RUN" --dir artifacts
      - name: Create draft with packages and checksums
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r checksum; do
            (cd "$(dirname "$checksum")" && sha256sum --check --strict SHA256SUMS)
          done < <(find artifacts -type f -name SHA256SUMS)
          source_record=$(find artifacts -type f -name SOURCE_COMMIT -print -quit)
          test -n "$source_record"
          test "$(cat "$source_record")" = "$SOURCE_SHA"
          mkdir payload
          find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.apk' -o -name '*.flatpak' -o -name '*.pkg.tar.zst' \) -exec cp -t payload/ {} +
          test -n "$(find payload -name 'linux-quest_*.deb' -print -quit)"
          printf '%s\n' "$SOURCE_SHA" > payload/SOURCE_COMMIT
          (cd payload && sha256sum -- * > ../SHA256SUMS)
          cp SHA256SUMS payload/
          cat > notes.md <<EOF
          Source commit: $SOURCE_SHA
          Build run: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN

          Draft for validation. The Quest APK is debug-signed for sideload testing;
          this workflow does not upload to Meta Horizon Store or the Snap Store.
          EOF
          gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" \
            --title "Linux Quest $RELEASE_TAG" --notes-file notes.md payload/*
